# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  version: 2026.7.17+0

package:
  name: reshell
  version: ${{ version }}

source:
  path: ..
  use_gitignore: true

build:
  # Bump when changing Windows linker discovery / install layout.
  number: 4
  script:
    # Use `cargo install --root` (same pattern as conda-forge ripgrep) so the
    # binary lands in a known place even when cargo writes under
    # target/<triple>/release/.
    - if: unix
      then: |
        set -euo pipefail
        cd "$SRC_DIR"
        cargo install --locked --no-track --force --path . --root "$PREFIX"
        test -x "$PREFIX/bin/reshell"
        rm -f "$PREFIX/.crates.toml" "$PREFIX/.crates2.json"
    # Windows: build-win.ps1 finds MSVC link.exe (vswhere / VCToolsInstallDir /
    # Program Files scan), pins CARGO_TARGET_*_LINKER, strips Git/msys/conda
    # unix link from PATH, and hard-fails with a prebuilt-install / winget hint
    # if MSVC is missing (issue #29: "/usr/bin/link: extra operand").
    - if: win
      then: build-win.ps1

requirements:
  build:
    - ${{ compiler('rust') }}
    # Only need a C compiler activation on Unix. On Windows, rust_win-64 already
    # depends on vs_win-64; a second VS activation can blow PATH length and
    # leave Git's link.exe first. Prefer the prebuilt windows-client release
    # when the host has no Visual Studio Build Tools.
    - if: unix
      then: ${{ compiler('c') }}

tests:
  - script:
      - if: unix
        then:
          - reshell --help
          - reshell ssh --help
          - test -x "$PREFIX/bin/reshell"
      - if: win
        then:
          - if not exist "%PREFIX%\Library\bin\reshell.exe" exit /b 1
          - reshell --help
          - reshell ssh --help

about:
  summary: Keep shells alive across SSH disconnects with explicit attach/detach sessions
  license: MIT
  license_file: LICENSE
