# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  version: 2026.7.17+0

package:
  name: reshell
  version: ${{ version }}

source:
  path: ..
  use_gitignore: true

build:
  # Bump when changing install layout / Windows linker workaround.
  number: 2
  script:
    # Use `cargo install --root` (same pattern as conda-forge ripgrep) so the
    # binary lands in a known place even when cargo writes under
    # target/<triple>/release/.
    - if: unix
      then: |
        set -euo pipefail
        cd "$SRC_DIR"
        cargo install --locked --no-track --path . --root "$PREFIX"
        test -x "$PREFIX/bin/reshell"
        rm -f "$PREFIX/.crates.toml" "$PREFIX/.crates2.json"
    # Windows: see build-win.bat — scrub Git/msys `link.exe` so MSVC's linker
    # is used (otherwise: "/usr/bin/link: extra operand", issue #29).
    - if: win
      then:
        - build-win.bat

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}

tests:
  - script:
      - if: unix
        then:
          - reshell --help
          - reshell ssh --help
          - test -x "$PREFIX/bin/reshell"
      - if: win
        then:
          - if not exist "%PREFIX%\Library\bin\reshell.exe" exit /b 1
          - reshell --help
          - reshell ssh --help

about:
  summary: Keep shells alive across SSH disconnects with explicit attach/detach sessions
  license: MIT
  license_file: LICENSE
