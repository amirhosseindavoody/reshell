# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

context:
  version: 2026.7.17+0

package:
  name: reshell
  version: ${{ version }}

source:
  path: ..
  use_gitignore: true

build:
  # Bump when changing install layout so cached empty Windows builds are not reused.
  number: 1
  script:
    # Use `cargo install --root` (same pattern as conda-forge ripgrep) so the
    # binary lands in a known place even when cargo writes under
    # target/<triple>/release/. A silent miss on Windows previously produced a
    # package with no .exe — pixi then reported that reshell "exposes nothing".
    - if: unix
      then: |
        set -euo pipefail
        cd "$SRC_DIR"
        cargo install --locked --no-track --path . --root "$PREFIX"
        test -x "$PREFIX/bin/reshell"
        rm -f "$PREFIX/.crates.toml" "$PREFIX/.crates2.json"
    - if: win
      then: |
        @echo on
        cd /d "%SRC_DIR%" || exit /b 1
        cargo install --locked --no-track --path . --root "%PREFIX%\Library" || exit /b 1
        if not exist "%PREFIX%\Library\bin\reshell.exe" (
          echo ERROR: reshell.exe missing after cargo install
          dir /s /b "%PREFIX%"
          exit /b 1
        )
        if exist "%PREFIX%\Library\.crates.toml" del /F /Q "%PREFIX%\Library\.crates.toml"
        if exist "%PREFIX%\Library\.crates2.json" del /F /Q "%PREFIX%\Library\.crates2.json"

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}

tests:
  - script:
      - if: unix
        then:
          - reshell --help
          - reshell ssh --help
          - test -x "$PREFIX/bin/reshell"
      - if: win
        then:
          - if not exist "%PREFIX%\Library\bin\reshell.exe" exit /b 1
          - reshell --help
          - reshell ssh --help

about:
  summary: Keep shells alive across SSH disconnects with explicit attach/detach sessions
  license: MIT
  license_file: LICENSE
