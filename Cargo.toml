[package]
name = "reshell"
version = "2026.7.17+0"
edition = "2021"
license = "MIT"
description = "Keep shells alive across SSH disconnects with explicit attach/detach sessions"
authors = ["Amirhossein Davoody <amirhossein.davoody@gmail.com>"]

[[bin]]
name = "reshell"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = [
    "fs",
    "ioctl",
    "poll",
    "process",
    "signal",
    "socket",
    "term",
    "user",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
