name: Windows package

# Build a win-64 conda package on a runner that has MSVC, so we can verify the
# Windows recipe (issue #29) and publish an artifact for offline install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  win64:
    name: pixi build (win-64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          environments: default

      - name: Show MSVC linker
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -property installationPath
          where.exe link

      - name: Build conda package
        run: pixi build

      - name: Upload .conda artifact
        uses: actions/upload-artifact@v4
        with:
          name: reshell-win-64-conda
          path: |
            *.conda
            **/*.conda
          if-no-files-found: error
